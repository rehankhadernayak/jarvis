<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #050a14;
      --bg2:      #070f1c;
      --bg3:      #0b1829;
      --accent:   #0ea5e9;
      --accent2:  #38bdf8;
      --green:    #10b981;
      --amber:    #f59e0b;
      --danger:   #ef4444;
      --muted:    #4a6380;
      --text:     #c8d8e8;
      --font:     'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html, body {
      width: 400px;
      height: 500px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 500px;
      width: 400px;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(14,165,233,0.2);
      background: var(--bg2);
      flex-shrink: 0;
    }

    #logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #orb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e3a5f, #050a14);
      border: 1.5px solid var(--accent);
      box-shadow: 0 0 8px rgba(14,165,233,0.5);
      flex-shrink: 0;
    }

    #logo-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(14,165,233,0.5);
    }

    #header-right {
      text-align: right;
    }

    #clock {
      font-size: 12px;
      color: var(--accent2);
      letter-spacing: 0.05em;
    }

    #status-dot {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    #status-dot.ready   { color: var(--green); }
    #status-dot.working { color: var(--amber); }
    #status-dot.error   { color: var(--danger); }

    /* ── Quick Actions ───────────────────────────────────────────────────── */
    #quick-actions {
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(14,165,233,0.1);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .qa-btn {
      flex: 1;
      min-width: 80px;
      background: transparent;
      border: 1px solid rgba(14,165,233,0.35);
      color: var(--accent);
      font-family: var(--font);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 5px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
      text-align: center;
      white-space: nowrap;
    }

    .qa-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(14,165,233,0.3);
      color: var(--accent2);
    }

    .qa-btn:active {
      background: rgba(14,165,233,0.1);
    }

    /* ── Messages ───────────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(14,165,233,0.3); border-radius: 2px; }

    .msg {
      max-width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      animation: fadein 0.15s ease;
    }

    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .msg.user {
      background: rgba(14,165,233,0.12);
      border: 1px solid rgba(14,165,233,0.2);
      align-self: flex-end;
      color: var(--accent2);
      max-width: 88%;
    }

    .msg.jarvis {
      background: var(--bg2);
      border: 1px solid rgba(14,165,233,0.08);
      border-left: 3px solid var(--green);
      color: var(--text);
      align-self: flex-start;
      width: 100%;
    }

    .msg.jarvis.streaming { border-left-color: var(--accent); }

    .msg.system {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      align-self: center;
    }

    /* thinking indicator */
    #thinking {
      display: none;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      flex-shrink: 0;
    }

    #thinking.active { display: flex; }

    .dot-pulse {
      display: flex;
      gap: 3px;
    }

    .dot-pulse span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ── Input Area ─────────────────────────────────────────────────────── */
    #input-area {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid rgba(14,165,233,0.15);
      background: var(--bg2);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid rgba(14,165,233,0.25);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 7px 10px;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 34px;
      max-height: 80px;
      overflow-y: auto;
    }

    #msg-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(14,165,233,0.15);
    }

    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: rgba(14,165,233,0.1);
      border: 1px solid rgba(14,165,233,0.4);
      border-radius: 5px;
      color: var(--accent);
      font-family: var(--font);
      font-size: 15px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover {
      background: rgba(14,165,233,0.2);
      box-shadow: 0 0 8px rgba(14,165,233,0.3);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="logo">
      <div id="orb"></div>
      <span id="logo-text">JARVIS</span>
    </div>
    <div id="header-right">
      <div id="clock">--:--:-- SGT</div>
      <div id="status-dot" class="ready">● READY</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div id="quick-actions">
    <button class="qa-btn" id="btn-summarize">SUMMARIZE PAGE</button>
    <button class="qa-btn" id="btn-research">RESEARCH THIS</button>
    <button class="qa-btn" id="btn-savedocs">SAVE TO DOCS</button>
    <button class="qa-btn" id="btn-status">JARVIS STATUS</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="msg system">JARVIS v2 — browser interface online</div>
  </div>

  <!-- Thinking indicator -->
  <div id="thinking">
    <div class="dot-pulse">
      <span></span><span></span><span></span>
    </div>
    <span>JARVIS is thinking...</span>
  </div>

  <!-- Input -->
  <div id="input-area">
    <textarea
      id="msg-input"
      placeholder="Ask JARVIS..."
      rows="1"
    ></textarea>
    <button id="send-btn" title="Send">&#8593;</button>
  </div>

</div>

<script>
'use strict';

const BASE = 'http://localhost:3001';
let sessionId = '';
let isStreaming = false;

// ── Session ID ────────────────────────────────────────────────────────────────
chrome.storage.local.get(['jarvis_ext_session'], (res) => {
  if (res.jarvis_ext_session) {
    sessionId = res.jarvis_ext_session;
  } else {
    sessionId = 'browser-ext-' + Date.now();
    chrome.storage.local.set({ jarvis_ext_session: sessionId });
  }
});

// ── Clock (SGT = UTC+8) ───────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const sgt = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Singapore' }));
  const pad = n => String(n).padStart(2, '0');
  const h = pad(sgt.getHours());
  const m = pad(sgt.getMinutes());
  const s = pad(sgt.getSeconds());
  document.getElementById('clock').textContent = `${h}:${m}:${s} SGT`;
}
updateClock();
setInterval(updateClock, 1000);

// ── Status helpers ────────────────────────────────────────────────────────────
function setStatus(label, cls) {
  const el = document.getElementById('status-dot');
  el.textContent = '● ' + label;
  el.className = cls || 'ready';
}

function setThinking(active) {
  document.getElementById('thinking').className = active ? 'active' : '';
  document.getElementById('send-btn').disabled = active;
  isStreaming = active;
}

// ── Message rendering ─────────────────────────────────────────────────────────
function addMessage(role, text, streaming) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (streaming ? ' streaming' : '');
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  scrollBottom();
  return el;
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ── SSE Streaming Chat — mirrors index.html sendMessage() exactly ─────────────
async function sendMessage(text) {
  if (isStreaming) return;
  const input = document.getElementById('msg-input');
  const msg = (text || input.value).trim();
  if (!msg) return;
  input.value = '';
  autoResize(input);

  addMessage('user', msg);
  setThinking(true);
  setStatus('PROCESSING...', 'working');

  const bubble = addMessage('jarvis', '', true);
  let fullText = '';

  try {
    const res = await fetch(`${BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, sessionId })
    });

    if (!res.ok) {
      bubble.textContent = `Error ${res.status}: ${res.statusText}`;
      bubble.style.borderLeftColor = 'var(--danger)';
      bubble.classList.remove('streaming');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      chunk.split('\n').forEach(line => {
        if (!line.startsWith('data: ')) return;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.text) {
            fullText += data.text;
            bubble.textContent = fullText;
            scrollBottom();
          }
        } catch {}
      });
    }

    if (!fullText) {
      bubble.textContent = '[No response received]';
      bubble.style.color = 'var(--muted)';
    }

  } catch (err) {
    bubble.textContent = 'Connection error: ' + err.message + '\n\nIs JARVIS running on localhost:3001?';
    bubble.style.borderLeftColor = 'var(--danger)';
    bubble.style.color = 'var(--danger)';
  } finally {
    bubble.classList.remove('streaming');
    setThinking(false);
    setStatus('READY', 'ready');
    scrollBottom();
  }
}

// ── Quick Actions ─────────────────────────────────────────────────────────────

// Get current tab info
async function getTab() {
  return new Promise(resolve => {
    chrome.tabs.query({ active: true, currentWindow: true }, tabs => {
      resolve(tabs[0] || { title: '', url: '' });
    });
  });
}

// Get selected text from active tab
async function getSelectedText() {
  return new Promise(resolve => {
    chrome.tabs.query({ active: true, currentWindow: true }, async (tabs) => {
      if (!tabs[0]) return resolve('');
      try {
        const results = await chrome.scripting.executeScript({
          target: { tabId: tabs[0].id },
          func: () => window.getSelection().toString().trim()
        });
        resolve(results[0]?.result || '');
      } catch {
        resolve('');
      }
    });
  });
}

document.getElementById('btn-summarize').addEventListener('click', async () => {
  const tab = await getTab();
  const query = `Summarize this page: ${tab.title} ${tab.url}`;
  sendMessage(query);
});

document.getElementById('btn-research').addEventListener('click', async () => {
  const tab = await getTab();
  const sel = await getSelectedText();
  const target = sel.length > 5 ? sel : tab.title;
  sendMessage(`Research: ${target}`);
});

document.getElementById('btn-savedocs').addEventListener('click', async () => {
  const tab = await getTab();
  setStatus('SAVING...', 'working');
  setThinking(true);
  const bubble = addMessage('jarvis', '', true);
  try {
    const res = await fetch(`${BASE}/memory/set`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        key: 'saved_page_' + Date.now(),
        value: JSON.stringify({ url: tab.url, title: tab.title, ts: Date.now() })
      })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      bubble.textContent = `Saved to JARVIS docs:\n${tab.title}\n${tab.url}`;
      bubble.classList.remove('streaming');
    } else {
      bubble.textContent = 'Save failed: ' + (data.error || res.statusText);
      bubble.style.borderLeftColor = 'var(--danger)';
      bubble.classList.remove('streaming');
    }
  } catch (err) {
    bubble.textContent = 'Connection error: ' + err.message;
    bubble.style.borderLeftColor = 'var(--danger)';
    bubble.classList.remove('streaming');
  } finally {
    setThinking(false);
    setStatus('READY', 'ready');
    scrollBottom();
  }
});

document.getElementById('btn-status').addEventListener('click', async () => {
  setStatus('FETCHING...', 'working');
  setThinking(true);
  const bubble = addMessage('jarvis', '', true);
  try {
    const res = await fetch(`${BASE}/status/full`);
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      const uptimeSec = data.uptime || data.uptimeSeconds || 0;
      const h = Math.floor(uptimeSec / 3600);
      const m = Math.floor((uptimeSec % 3600) / 60);
      const uptimeStr = `${h}h ${m}m`;
      const memUsed = data.memory?.heapUsed
        ? Math.round(data.memory.heapUsed / 1024 / 1024) + ' MB'
        : 'N/A';
      const routes = data.routes || data.routeCount || '?';
      bubble.textContent = [
        'JARVIS STATUS',
        '─────────────────',
        `Uptime:  ${uptimeStr}`,
        `Memory:  ${memUsed}`,
        `Routes:  ${routes}`,
        `Version: ${data.version || 'v2'}`,
        `Port:    3001`
      ].join('\n');
    } else {
      bubble.textContent = 'Status fetch failed: ' + res.statusText;
      bubble.style.borderLeftColor = 'var(--danger)';
    }
    bubble.classList.remove('streaming');
  } catch (err) {
    bubble.textContent = 'JARVIS offline or unreachable.\n' + err.message;
    bubble.style.borderLeftColor = 'var(--danger)';
    bubble.classList.remove('streaming');
  } finally {
    setThinking(false);
    setStatus('READY', 'ready');
    scrollBottom();
  }
});

// ── Input controls ─────────────────────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', () => sendMessage());

document.getElementById('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('msg-input').addEventListener('input', function () {
  autoResize(this);
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}
</script>
</body>
</html>
